services:
  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - microservice-network

  ai-agent-service:
    build:
      context: ./ai-agent-service
      dockerfile: Dockerfile
    networks:
      - microservice-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - microservice-network

networks:
  microservice-network:
    driver: bridge