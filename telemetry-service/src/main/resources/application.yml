server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:telemetry_db
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

kafka:
  bootstrap-servers: localhost:9092
  topic: telemetry_topic

logging:
  level:
    root: INFO
    com.enterprise.telemetry: DEBUG